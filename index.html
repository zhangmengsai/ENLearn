<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>48国际音标 谐音版 · 点击发音</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #eef0f2;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Arial Unicode MS", "Helvetica Neue", Arial, sans-serif;
    color: #1a1a1a;
    padding: 24px 12px;
  }
  .sheet {
    max-width: 980px;
    margin: 0 auto;
    background: #fff;
    border: 1.5px solid #d0d0d0;
    border-radius: 22px;
    padding: 34px 30px 26px;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
  }

  h1 {
    text-align: center;
    font-size: clamp(30px, 5vw, 50px);
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  h1 .red { color: #d4232a; }
  h1 .blk { color: #111; margin-left: 14px; }
  .hint {
    text-align: center;
    color: #999;
    font-size: 13px;
    margin-bottom: 26px;
  }

  /* ===== 大分区（元音 / 辅音） ===== */
  .section { display: flex; align-items: stretch; margin-bottom: 34px; }
  .rail { display: flex; align-items: stretch; flex: none; margin-right: 10px; }
  .rail-label {
    writing-mode: vertical-rl;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 6px;
    padding: 4px 2px;
  }
  .section.vowel .rail-label { color: #d4232a; }
  .section.cons  .rail-label { color: #d4232a; }
  .brace {
    width: 16px;
    border: 2.5px solid #222;
    border-right: none;
    border-radius: 18px 0 0 18px;
    margin: 6px 0;
  }
  .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }

  /* ===== 次级分组（单元音 / 双元音 / 清浊成对辅音 …） ===== */
  .group { display: flex; align-items: stretch; }
  .group .rail-label { font-size: 17px; letter-spacing: 3px; color: #111; font-weight: 700; }
  .group .brace { width: 11px; border-width: 2px; border-radius: 12px 0 0 12px; margin: 2px 0; }
  .group .body { gap: 12px; }

  /* ===== 行（分类药丸 + 音标卡片） ===== */
  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; }
  .pill {
    flex: none;
    border: 1.5px solid #222;
    border-radius: 999px;
    padding: 5px 15px;
    font-size: 15px;
    font-weight: 600;
    background: #fff;
    white-space: nowrap;
  }

  /* ===== 音标卡片 ===== */
  .ph {
    position: relative;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    min-width: 74px;
    padding: 8px 8px 10px;
    border: 2px solid transparent;
    border-radius: 14px;
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    transition: transform .15s, border-color .15s, background .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .ph:hover { transform: translateY(-3px); background: #fff6f6; border-color: #f3c2c4; }
  .ph:active { transform: scale(.96); }
  .ph .sym {
    font-size: clamp(21px, 2.6vw, 29px);
    font-weight: 800;
    line-height: 1.15;
    color: #111;
    white-space: nowrap;
  }
  .ph .py {
    font-size: clamp(13px, 1.6vw, 16px);
    color: #d4232a;
    font-weight: 700;
    white-space: nowrap;
  }
  .ph.playing {
    border-color: #d4232a;
    background: #fff1f1;
    box-shadow: 0 0 0 4px rgba(212,35,42,.13);
    transform: translateY(-3px) scale(1.05);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(212,35,42,.13); }
    50%      { box-shadow: 0 0 0 9px rgba(212,35,42,.06); }
  }
  .bars {
    position: absolute;
    top: 6px;
    right: 8px;
    display: none;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
  }
  .ph.playing .bars { display: flex; }
  .bars i {
    width: 3px;
    background: #d4232a;
    border-radius: 2px;
    animation: bounce .8s ease-in-out infinite;
  }
  .bars i:nth-child(1) { height: 6px;  animation-delay: 0s;   }
  .bars i:nth-child(2) { height: 13px; animation-delay: .15s; }
  .bars i:nth-child(3) { height: 9px;  animation-delay: .3s;  }
  @keyframes bounce {
    0%, 100% { transform: scaleY(.45); }
    50%      { transform: scaleY(1); }
  }

  /* ===== 双元音的滑动前缀 ===== */
  .glide {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 17px;
    font-weight: 700;
    color: #111;
    margin-right: 4px;
    white-space: nowrap;
  }
  .glide .dash { color: #888; font-weight: 400; }
  .glide .to   { color: #d4232a; }
  .glide .py   { color: #d4232a; font-size: 14px; }

  .footer {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin-top: 6px;
  }

  @media (max-width: 640px) {
    .sheet { padding: 22px 12px 18px; border-radius: 16px; }
    .rail-label { font-size: 21px; letter-spacing: 4px; }
    .ph { min-width: 62px; padding: 6px 4px 8px; }
    .pill { font-size: 13px; padding: 4px 11px; }
  }
</style>
</head>
<body>
<div class="sheet">
  <h1><span class="red">48国际音标</span><span class="blk">谐音版</span></h1>
  <p class="hint">点击任意音标卡片，即可播放标准发音</p>

  <!-- ================= 元音 ================= -->
  <section class="section vowel">
    <div class="rail"><div class="rail-label">元音</div><div class="brace"></div></div>
    <div class="body">

      <!-- 单元音 -->
      <div class="group">
        <div class="rail"><div class="rail-label">单元音</div><div class="brace"></div></div>
        <div class="body">
          <div class="row">
            <span class="pill">长元音</span>
            <button class="ph" data-src="xdf-phonetic/ɑ_0-0-2-4.mp3"><span class="sym">【ɑ:】</span><span class="py">(啊)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/ɔ_0-0-2-2.mp3"><span class="sym">【ɔ:】</span><span class="py">(哦)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/i_0-0-0-0.mp3"><span class="sym">【i:】</span><span class="py">(医)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/u_0-0-2-0.mp3"><span class="sym">【u:】</span><span class="py">(乌)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/ɜ_0-0-1-0.mp3"><span class="sym">【ɜ:】</span><span class="py">(饿)</span><span class="bars"><i></i><i></i><i></i></span></button>
          </div>
          <div class="row">
            <span class="pill">短元音</span>
            <button class="ph" data-src="xdf-phonetic/ʌ_0-0-1-2.mp3"><span class="sym">【ʌ】</span><span class="py">(阿)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/ɒ_0-0-2-3.mp3"><span class="sym">【ɒ】</span><span class="py">(噢)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/ɪ_0-0-0-1.mp3"><span class="sym">【ɪ】</span><span class="py">(一)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/ʊ_0-0-2-1.mp3"><span class="sym">【ʊ】</span><span class="py">(呜)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/ə_0-0-1-1.mp3"><span class="sym">【ə】</span><span class="py">(鹅)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/e_0-0-0-2.mp3"><span class="sym">【e】</span><span class="py">(唉)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/æ_0-0-0-3.mp3"><span class="sym">【æ】</span><span class="py">(唉·大口)</span><span class="bars"><i></i><i></i><i></i></span></button>
          </div>
        </div>
      </div>

      <!-- 双元音 -->
      <div class="group">
        <div class="rail"><div class="rail-label">双元音</div><div class="brace"></div></div>
        <div class="body">
          <div class="row">
            <span class="glide">【ɪ】<span class="dash">—</span><span class="py">(一)</span><span class="to">→</span></span>
            <button class="ph" data-src="xdf-phonetic/eɪ_0-1-0-0.mp3"><span class="sym">【eɪ】</span><span class="py">(诶)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/aɪ_0-1-0-1.mp3"><span class="sym">【aɪ】</span><span class="py">(啊一)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/ɔɪ_0-1-0-2.mp3"><span class="sym">【ɔɪ】</span><span class="py">(哦一)</span><span class="bars"><i></i><i></i><i></i></span></button>
          </div>
          <div class="row">
            <span class="glide">【ʊ】<span class="dash">—</span><span class="py">(呜)</span><span class="to">→</span></span>
            <button class="ph" data-src="xdf-phonetic/aʊ_0-1-0-3.mp3"><span class="sym">【aʊ】</span><span class="py">(啊呜)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/əʊ_0-1-0-4.mp3"><span class="sym">【əʊ】</span><span class="py">(鹅呜)</span><span class="bars"><i></i><i></i><i></i></span></button>
          </div>
          <div class="row">
            <span class="glide">【ə】<span class="dash">—</span><span class="py">(鹅)</span><span class="to">→</span></span>
            <button class="ph" data-src="xdf-phonetic/ɪə_0-1-1-0.mp3"><span class="sym">【ɪə】</span><span class="py">(一鹅)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/eə_0-1-1-1.mp3"><span class="sym">【eə】</span><span class="py">(二鹅)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/ʊə_0-1-1-2.mp3"><span class="sym">【ʊə】</span><span class="py">(五鹅)</span><span class="bars"><i></i><i></i><i></i></span></button>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ================= 辅音 ================= -->
  <section class="section cons">
    <div class="rail"><div class="rail-label">辅音</div><div class="brace"></div></div>
    <div class="body">

      <!-- 清浊成对辅音 -->
      <div class="group">
        <div class="rail"><div class="rail-label">清浊成对辅音</div><div class="brace"></div></div>
        <div class="body">
          <div class="row">
            <span class="pill">清辅音</span>
            <button class="ph" data-src="xdf-phonetic/p_1-0-0-0.mp3"><span class="sym">【p】</span><span class="py">(婆)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/t_1-0-0-1.mp3"><span class="sym">【t】</span><span class="py">(特)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/k_1-0-0-2.mp3"><span class="sym">【k】</span><span class="py">(渴)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/f_1-0-1-0.mp3"><span class="sym">【f】</span><span class="py">(夫)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/s_1-0-1-1.mp3"><span class="sym">【s】</span><span class="py">(撕)</span><span class="bars"><i></i><i></i><i></i></span></button>
          </div>
          <div class="row">
            <span class="pill">浊辅音</span>
            <button class="ph" data-src="xdf-phonetic/b_1-1-0-0.mp3"><span class="sym">【b】</span><span class="py">(伯)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/d_1-1-0-1.mp3"><span class="sym">【d】</span><span class="py">(的)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/g_1-1-0-2.mp3"><span class="sym">【g】</span><span class="py">(哥)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/v_1-1-1-0.mp3"><span class="sym">【v】</span><span class="py">(舞)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/z_1-1-1-1.mp3"><span class="sym">【z】</span><span class="py">(姿)</span><span class="bars"><i></i><i></i><i></i></span></button>
          </div>
          <div class="row">
            <span class="pill">清辅音</span>
            <button class="ph" data-src="xdf-phonetic/θ_1-0-1-3.mp3"><span class="sym">【θ】</span><span class="py">(紫)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/ʃ_1-0-1-2.mp3"><span class="sym">【ʃ】</span><span class="py">(狮)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/tʃ_1-0-2-0.mp3"><span class="sym">【tʃ】</span><span class="py">(骑)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/tr_1-0-2-1.mp3"><span class="sym">【tr】</span><span class="py">(戳)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/ts_1-0-2-2.mp3"><span class="sym">【ts】</span><span class="py">(雌)</span><span class="bars"><i></i><i></i><i></i></span></button>
          </div>
          <div class="row">
            <span class="pill">浊辅音</span>
            <button class="ph" data-src="xdf-phonetic/ð_1-1-1-3.mp3"><span class="sym">【ð】</span><span class="py">(恣)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/ʒ_1-1-1-2.mp3"><span class="sym">【ʒ】</span><span class="py">(日)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/dʒ_1-1-2-0.mp3"><span class="sym">【dʒ】</span><span class="py">(只)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/dr_1-1-2-1.mp3"><span class="sym">【dr】</span><span class="py">(捉)</span><span class="bars"><i></i><i></i><i></i></span></button>
            <button class="ph" data-src="xdf-phonetic/dz_1-1-2-2.mp3"><span class="sym">【dz】</span><span class="py">(自)</span><span class="bars"><i></i><i></i><i></i></span></button>
          </div>
        </div>
      </div>

      <!-- 鼻音 -->
      <div class="row">
        <span class="pill">鼻音</span>
        <button class="ph" data-src="xdf-phonetic/m_1-1-3-0.mp3"><span class="sym">【m】</span><span class="py">(目)</span><span class="bars"><i></i><i></i><i></i></span></button>
        <button class="ph" data-src="xdf-phonetic/n_1-1-3-1.mp3"><span class="sym">【n】</span><span class="py">(恩)</span><span class="bars"><i></i><i></i><i></i></span></button>
        <button class="ph" data-src="xdf-phonetic/ŋ_1-1-3-2.mp3"><span class="sym">【ŋ】</span><span class="py">(嗯)</span><span class="bars"><i></i><i></i><i></i></span></button>
      </div>

      <!-- 似拼音 -->
      <div class="row">
        <span class="pill">似拼音</span>
        <button class="ph" data-src="xdf-phonetic/h_1-0-1-4.mp3"><span class="sym">【h】</span><span class="py">(喝)</span><span class="bars"><i></i><i></i><i></i></span></button>
        <button class="ph" data-src="xdf-phonetic/r_1-1-1-4.mp3"><span class="sym">【r】</span><span class="py">(弱)</span><span class="bars"><i></i><i></i><i></i></span></button>
        <button class="ph" data-src="xdf-phonetic/ǀ_1-1-4-0.mp3"><span class="sym">【l】</span><span class="py">(了)</span><span class="bars"><i></i><i></i><i></i></span></button>
      </div>

      <!-- 半元音 -->
      <div class="row">
        <span class="pill">半元音</span>
        <button class="ph" data-src="xdf-phonetic/j_1-1-5-0.mp3"><span class="sym">【j】</span><span class="py">(爷)</span><span class="bars"><i></i><i></i><i></i></span></button>
        <button class="ph" data-src="xdf-phonetic/w_1-1-5-1.mp3"><span class="sym">【w】</span><span class="py">(我)</span><span class="bars"><i></i><i></i><i></i></span></button>
      </div>

    </div>
  </section>

  <p class="footer">标准发音音频来自新东方国际音标表 · 共 48 个音标</p>
</div>

<script>
  const audio = new Audio();
  audio.preload = 'auto';
  let current = null;

  function stopCurrent() {
    audio.pause();
    if (current) current.classList.remove('playing');
    current = null;
  }

  document.querySelectorAll('.ph').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (current === btn) { stopCurrent(); return; }
      stopCurrent();
      audio.src = encodeURI(btn.dataset.src);
      audio.currentTime = 0;
      audio.play().then(function () {
        current = btn;
        btn.classList.add('playing');
      }).catch(function (err) {
        console.log('播放失败:', btn.dataset.src, err);
      });
    });
  });

  audio.addEventListener('ended', stopCurrent);
</script>
</body>
</html>
